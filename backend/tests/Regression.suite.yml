# REGRESSION (backend) — in-process functional tests through the Yii2 module:
# access control, list, edit, hide, delete against MySQL (own schema), with
# the realtime publisher replaced by a spy so every published event is asserted.
actor: RegressionTester
modules:
    enabled:
        - Yii2:
            recreateApplication: true
            transaction: false
        - Asserts
