# Black-box project: talks to the running test stack (frontend-test,
# backend-test, ws-test, selenium) over the network only. No Yii in-process.
namespace: blackbox\tests
bootstrap: bootstrap.php
support_namespace: Support
paths:
    tests: tests
    output: tests/Support/output
    data: tests/Support/data
    support: tests/Support
    envs: tests/Support/envs
actor_suffix: Tester
params:
    - env
settings:
    memory_limit: 1024M
    colors: true
extensions:
    enabled:
        - Codeception\Extension\RunFailed
