# E2E — a real Chromium (selenium service) types into the wall, logs into the
# admin panel and watches the row arrive over the WebSocket without a reload.
actor: E2ETester
modules:
    enabled:
        - WebDriver:
            url: '%E2E_FRONTEND_URL%'
            host: '%SELENIUM_HOST%'
            port: 4444
            browser: chrome
            window_size: 1400x900
            wait: 0
            connection_timeout: 30
            request_timeout: 60
            capabilities:
                goog:chromeOptions:
                    args: ['--no-sandbox', '--disable-dev-shm-usage']
        - Asserts
        - blackbox\tests\Support\Helper\Stack:
            frontend: '%E2E_FRONTEND_URL%'
            backend: '%E2E_BACKEND_URL%'
            wsHost: '%E2E_WS_HOST%'
            wsPort: '%E2E_WS_PORT%'
            adminUser: '%ADMIN_USERNAME%'
            adminPassword: '%ADMIN_PASSWORD%'
step_decorators: ~
