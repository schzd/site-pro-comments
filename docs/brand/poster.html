<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #121310; }
  .card { width: 1280px; height: 720px; position: relative; overflow: hidden;
    background: url(poster-bg.jpg) center / cover; font-family: "Chakra Petch", sans-serif; color: #eeedea; }
  .shade { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(18,19,16,.15), rgba(18,19,16,.65)); }
  .cta { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; }
  .play { flex: none;
    width: 92px; height: 92px; border-radius: 50%; background: #dcff48; display: grid; place-items: center;
    box-shadow: 0 0 0 14px rgba(220,255,72,.16), 0 0 80px rgba(220,255,72,.45); }
  .play::after { content: ""; margin-left: 10px; border-style: solid; border-width: 19px 0 19px 32px; border-color: transparent transparent transparent #121310; }
  .label { white-space: nowrap;
    font: 600 22px "JetBrains Mono", monospace; color: #dcff48; padding: 10px 18px; border-radius: 10px;
    background: rgba(13,14,11,.9); border: 1px solid rgba(220,255,72,.45); }
</style>
</head>
<body>
<div class="card">
  <div class="shade"></div>
  <div class="cta"><div class="play"></div>
  <div class="label">Watch the 2:37 explainer · Russian voice-over</div></div>
</div>
</body>
</html>
