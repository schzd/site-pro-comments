# REGRESSION (frontend) — in-process functional tests through the Yii2 module:
# real routing, controllers, validation and MySQL (own schema), with the
# realtime publisher replaced by a spy so every published event is asserted.
actor: RegressionTester
modules:
    enabled:
        - Yii2:
            # A fresh application per request, like production (no state leaks
            # between requests, e.g. a JSON response format).
            recreateApplication: true
            # Fresh app = fresh DB connection, so a wrapping transaction would
            # hide test data from it. Fixtures are reloaded before every test.
            transaction: false
        - Asserts
